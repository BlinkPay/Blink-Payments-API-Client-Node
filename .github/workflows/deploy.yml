name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  npm_publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22 ]
    if: github.event.release.target_commitish == 'master'
    permissions:
      # Lets npm authenticate to the registry via OIDC (trusted publishing) instead of a long-lived token
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes back to the repo, so don't leave the token in .git/config
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
      - name: Update npm
        # Node 22 bundles npm 10; trusted publishing needs 11.5.1+ and staged publishing needs 11.15.0+.
        # Pinned exactly so the release build is reproducible; npm 12 requires Node 22.22.2+.
        run: npm install -g --ignore-scripts npm@12.0.2
      - name: Install packages
        # Dependency lifecycle scripts are a supply-chain vector and nothing here needs them
        run: npm ci --ignore-scripts
      - name: Set version
        run: npm version --allow-same-version --no-git-tag-version ${{ github.event.release.tag_name }}
      - name: Build
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Stage for publishing
        # Submits the package to npm's staging area; a maintainer approves it with 2FA before it goes live.
        # Authenticates via OIDC, so no NPM_TOKEN is needed here.
        run: npm stage publish
