name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes back to the repo, so don't leave the token in .git/config
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        # Dependency lifecycle scripts are a supply-chain vector and nothing here needs them
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm test -- --coverage
        env:
          BLINKPAY_DEBIT_URL: ${{ vars.DEBIT_URL }}
          BLINKPAY_CLIENT_ID: ${{ vars.CLIENT_ID }}
          BLINKPAY_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      - name: Upload coverage report
        # Uploaded on a red run too, so a sandbox flake in the integration suite
        # does not also cost us the Sonar analysis.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info

  # Aikido's PR check waits 30 minutes for a report tied to the PR head commit,
  # which the action reads from the event payload. Kept as its own job so the
  # OIDC token grant stays off the test job, as Aikido recommends. Fork PRs
  # cannot mint an OIDC token, so they are skipped.
  aikido-coverage:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@e0637ab96a560c1ab11671c41a4a4668075bae0e # v2.1.1
        with:
          region: au
          file-paths: coverage/lcov.info

  sonar:
    needs: build_test
    # Quality feedback should still land when the tests fail.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes back to the repo, so don't leave the token in .git/config
          persist-credentials: false
          # Full history so SonarCloud can attribute new code accurately
          fetch-depth: 0
      # Sonar does not run the tests; it reads the report build_test generated.
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
        # No artifact when build_test failed before the tests ran; scan without coverage.
        continue-on-error: true
      # Sonar reports 0.0% rather than failing when the report is absent, so say so here.
      - name: Check the coverage report arrived
        run: |
          if [ -s coverage/lcov.info ]; then
            echo "::notice::Coverage report found: $(grep -c '^SF:' coverage/lcov.info) files"
          else
            echo "::warning::No coverage report at coverage/lcov.info; Sonar will report 0.0%"
            echo "lcov.info files actually present:"
            find . -name lcov.info -not -path './node_modules/*'
          fi
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar
      - name: Run Sonar
        uses: sonarsource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          projectBaseDir: .
          # sonar.coverage.exclusions drops the DTOs from the coverage metric but keeps them
          # analysed: they are generated from the OpenAPI spec, so covering them tests the generator.
          args: >
            -Dsonar.projectKey=blink-debit-api-client-node
            -Dsonar.organization=blinkpay
            -Dsonar.sources=.
            -Dsonar.tests=test,integrationTest
            -Dsonar.exclusions=node_modules/**,dist/**,coverage/**,assets/**,.github/**,test/**,integrationTest/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=src/dto/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        continue-on-error: true
